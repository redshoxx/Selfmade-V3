  <script>
  (function(){
    var local=location.hostname==='localhost'||location.hostname==='127.0.0.1'
    document.documentElement.dataset.nestBuild='3.2.1-r12'
    if(local)document.documentElement.dataset.nestLocalBuild='3.2.1-r12'
    if(typeof document.startViewTransition==='function'){
      try{
        document.startViewTransition=function(update){
          var done
          try{done=Promise.resolve(typeof update==='function'?update():undefined)}catch(err){done=Promise.reject(err)}
          return{ready:done,updateCallbackDone:done,finished:done,skipTransition:function(){}}
        }
      }catch(_){}
    }
  })()
  </script>

  <style>
    .v3-main{animation:nest-fast-enter .13s cubic-bezier(.2,.8,.2,1)!important}
    @keyframes nest-fast-enter{from{opacity:.72;transform:translate3d(0,3px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
    .v3-nav.v31-nav{grid-template-columns:repeat(7,minmax(0,1fr))!important;padding-left:6px!important;padding-right:6px!important;-webkit-backdrop-filter:blur(14px) saturate(125%)!important;backdrop-filter:blur(14px) saturate(125%)!important;transform:translate3d(-50%,0,0);contain:layout paint style}
    .v3-nav.v31-nav [data-v31-more]{display:none!important}
    .v3-nav.v31-nav [data-route="overview"]{grid-column:1}
    .v3-nav.v31-nav [data-route="transactions"]{grid-column:2}
    .v3-nav.v31-nav [data-v31-route="tasks"]{grid-column:3}
    .v3-nav.v31-nav [data-route="shopping"]{grid-column:5}
    .v3-nav.v31-nav [data-route="savings"]{grid-column:6/8}
    .v3-nav.v31-nav>button:not(.v3-plus){transition:color .11s ease,transform .11s ease}
    .v3-nav.v31-nav>button:not(.v3-plus):active{transform:scale(.94)}
    .v3-nav.v31-nav .v3-plus{position:absolute!important;left:50%!important;top:50%!important;z-index:6!important;margin:0!important;transform:translate3d(-50%,-64%,0)!important;will-change:transform;transition:transform .11s ease!important}
    .v3-nav.v31-nav .v3-plus:active{transform:translate3d(-50%,-60%,0) scale(.94)!important}
    .v31-task-content,.v3-row,.v3-saving-row,.v3-shop-row{contain:layout paint style}
    .v31-task-content{transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .12s ease,scale .12s ease!important}
    .v3-progress i{transition:width .18s ease!important}
    .v3-dialog::backdrop{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
    @media(max-width:430px){
      .v3-nav.v31-nav{grid-template-columns:repeat(7,minmax(0,1fr))!important}
      .v3-nav.v31-nav .v3-plus{width:54px!important;height:54px!important}
      .v3-nav.v31-nav>button span{font-size:6.4px!important}
    }
    @media(prefers-reduced-motion:reduce){.v3-main{animation:none!important}}
  </style>
  <title>NEST 3.2</title>
</head>
<body>
  <div id="app"><main class="boot"><div class="brand-mark">N</div><h1>NEST</h1><p>Deine Daten werden sicher geladen …</p></main></div>
  <dialog id="sheet"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/boot-v2.0.2.js?v=3.2.1-r12"></script>
  <script src="/v202-core-safe.js?v=3.2.1-r12"></script>
  <script src="/shopping-core-v3.js?v=3.2.1-r12"></script>
  <script src="/tasks-core-v3.1-fixed.js?v=3.2.1-r12"></script>
  <script>
  (function(root){
    'use strict'
    var taskMode=false,saving=false
    function tasksActive(){return taskMode||document.documentElement.dataset.v31Tasks==='on'||document.querySelector('.v3-main')?.dataset.page==='tasks'}
    function toast(message,bad){var t=document.getElementById('toast');if(!t)return;t.textContent=message;t.classList.toggle('bad',!!bad);t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.classList.remove('show','bad')},2200)}
    function openTasks(){taskMode=true;var UI=root.NestTasksV31;if(UI&&UI.open)UI.open()}
    function saveTask(form){
      if(saving)return
      saving=true
      try{
        var Tasks=root.NestTasksCoreV31,UI=root.NestTasksV31
        if(!Tasks||!UI)throw new Error('Aufgabenmodul ist nicht bereit')
        var d=new FormData(form),id=String(d.get('id')||''),title=String(d.get('title')||'').trim(),date=String(d.get('date')||''),time=String(d.get('time')||''),priority=String(d.get('priority')||'normal'),repeat=String(d.get('repeat')||'none'),linkType=String(d.get('linkType')||'none'),linkId=linkType==='savings'?String(d.get('linkId')||''):'',rawReminder=String(d.get('reminderMinutes')||''),reminderMinutes=rawReminder===''?null:Number(rawReminder)
        if(!title||!date)throw new Error('Bitte Aufgabe und Datum eingeben')
        var patch={title:title,date:date,time:time,priority:priority,repeat:repeat,linkType:linkType,linkId:linkId,reminderMinutes:reminderMinutes}
        if(id)Tasks.store.update(id,patch);else Tasks.store.add(patch)
        var dialog=document.getElementById('v31TaskDialog');if(dialog&&dialog.open)dialog.close()
        taskMode=true
        requestAnimationFrame(function(){if(taskMode)UI.open()})
        toast(id?'Aufgabe gespeichert':'Aufgabe erstellt')
      }catch(err){console.error(err);toast(err&&err.message||'Aufgabe konnte nicht gespeichert werden',true)}finally{setTimeout(function(){saving=false},80)}
    }
    root.addEventListener('pointerdown',function(e){
      var taskRoute=e.target.closest&&e.target.closest('[data-v31-route="tasks"]')
      if(taskRoute){taskMode=true;return}
      var regular=e.target.closest&&e.target.closest('[data-route]')
      if(regular)taskMode=false
    },true)
    root.addEventListener('click',function(e){
      var submit=e.target.closest&&e.target.closest('#v31TaskForm button[type="submit"]')
      if(submit){e.preventDefault();e.stopImmediatePropagation();var form=submit.closest('form');if(form&&(!form.reportValidity||form.reportValidity()))saveTask(form);return}
      var taskRoute=e.target.closest&&e.target.closest('[data-v31-route="tasks"]')
      if(taskRoute){e.preventDefault();e.stopImmediatePropagation();openTasks();return}
      var plus=e.target.closest&&e.target.closest('.v3-plus')
      if(plus&&tasksActive()){e.preventDefault();e.stopImmediatePropagation();taskMode=true;var UI=root.NestTasksV31;if(UI&&UI.openForm)UI.openForm();return}
      var regular=e.target.closest&&e.target.closest('[data-route]')
      if(regular&&tasksActive()){taskMode=false;var UI2=root.NestTasksV31;if(UI2&&UI2.close)UI2.close()}
    },true)
    root.addEventListener('submit',function(e){
      var form=e.target
      if(!form||form.id!=='v31TaskForm')return
      e.preventDefault();e.stopImmediatePropagation()
      if(!form.reportValidity||form.reportValidity())saveTask(form)
    },true)
    root.addEventListener('load',function(){
      var App=root.NestAppV3,UI=root.NestTasksV31
      if(!App||!UI||typeof App.render!=='function'||App.__tasksRenderGuard)return
      var original=App.render.bind(App)
      App.render=function(){var result=original.apply(null,arguments);if(taskMode)queueMicrotask(function(){if(taskMode)UI.open()});return result}
      App.__tasksRenderGuard=true
    },{once:true})
  })(globalThis)
  </script>
