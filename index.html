<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="NEST 3.1 – minimalistischer Finanz-, Aufgaben-, Spar- und Einkaufsplaner mit kontextabhängigem Plus, Swipe-Gesten, Barcode-Scanner und Produktdaten.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NEST">
  <meta name="nest-version" content="3.1.0-r6">
  <script>
  (function(){
    var local=location.hostname==='localhost'||location.hostname==='127.0.0.1'
    if(!local)return
    document.documentElement.dataset.nestLocalBuild='r6'
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){return Promise.all(regs.map(function(reg){return reg.unregister()}))}).catch(function(){})}
    if('caches' in window){caches.keys().then(function(keys){return Promise.all(keys.filter(function(k){return k.indexOf('nest-')===0||k.indexOf('selfmade-')===0}).map(function(k){return caches.delete(k)}))}).catch(function(){})}
  })()
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/v3.css?v=3.1.0-r6">
  <link rel="stylesheet" href="/v3-shopping.css?v=3.1.0-r6">
  <link rel="stylesheet" href="/v301-shopping.css?v=3.1.0-r6">
  <link rel="stylesheet" href="/tasks-v3.1.css?v=3.1.0-r6">
  <link rel="stylesheet" href="/v3-dialogs.css?v=3.1.0-r6">
  <title>NEST 3.1</title>
</head>
<body>
  <div id="app"><main class="boot"><div class="brand-mark">N</div><h1>NEST</h1><p>Deine Daten werden sicher geladen …</p></main></div>
  <dialog id="sheet"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/boot-v2.0.2.js?v=3.1.0-r6"></script>
  <script src="/v202-core-safe.js?v=3.1.0-r6"></script>
  <script src="/shopping-core-v3.js?v=3.1.0-r6"></script>
  <script src="/tasks-core-v3.1-fixed.js?v=3.1.0-r6"></script>
  <script>
  (function(root){
    'use strict'
    var taskMode=false,saving=false
    function tasksActive(){return taskMode||document.documentElement.dataset.v31Tasks==='on'||document.querySelector('.v3-main')?.dataset.page==='tasks'}
    function toast(message,bad){var t=document.getElementById('toast');if(!t)return;t.textContent=message;t.classList.toggle('bad',!!bad);t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.classList.remove('show','bad')},2600)}
    function openTasks(){taskMode=true;var UI=root.NestTasksV31;if(UI&&UI.open)UI.open()}
    function saveTask(form){
      if(saving)return
      saving=true
      try{
        var Tasks=root.NestTasksCoreV31,UI=root.NestTasksV31
        if(!Tasks||!UI)throw new Error('Aufgabenmodul ist nicht bereit')
        var d=new FormData(form),id=String(d.get('id')||''),title=String(d.get('title')||'').trim(),date=String(d.get('date')||''),time=String(d.get('time')||''),priority=String(d.get('priority')||'normal'),repeat=String(d.get('repeat')||'none'),linkType=String(d.get('linkType')||'none'),linkId=linkType==='savings'?String(d.get('linkId')||''):'',rawReminder=String(d.get('reminderMinutes')||''),reminderMinutes=rawReminder===''?null:Number(rawReminder)
        if(!title||!date)throw new Error('Bitte Aufgabe und Datum eingeben')
        var patch={title:title,date:date,time:time,priority:priority,repeat:repeat,linkType:linkType,linkId:linkId,reminderMinutes:reminderMinutes}
        if(id)Tasks.store.update(id,patch);else Tasks.store.add(patch)
        var dialog=document.getElementById('v31TaskDialog');if(dialog&&dialog.open)dialog.close()
        taskMode=true
        UI.open()
        requestAnimationFrame(function(){if(taskMode)UI.open()})
        toast(id?'Aufgabe gespeichert':'Aufgabe erstellt')
      }catch(err){console.error(err);toast(err&&err.message||'Aufgabe konnte nicht gespeichert werden',true)}finally{setTimeout(function(){saving=false},100)}
    }
    root.addEventListener('pointerdown',function(e){
      var taskRoute=e.target.closest&&e.target.closest('[data-v31-route="tasks"]')
      if(taskRoute){taskMode=true;return}
      var regular=e.target.closest&&e.target.closest('[data-route]')
      if(regular)taskMode=false
    },true)
    root.addEventListener('click',function(e){
      var submit=e.target.closest&&e.target.closest('#v31TaskForm button[type="submit"]')
      if(submit){e.preventDefault();e.stopImmediatePropagation();var form=submit.closest('form');if(form&&(!form.reportValidity||form.reportValidity()))saveTask(form);return}
      var taskRoute=e.target.closest&&e.target.closest('[data-v31-route="tasks"]')
      if(taskRoute){e.preventDefault();e.stopImmediatePropagation();openTasks();return}
      var plus=e.target.closest&&e.target.closest('.v3-plus')
      if(plus&&tasksActive()){e.preventDefault();e.stopImmediatePropagation();taskMode=true;var UI=root.NestTasksV31;if(UI&&UI.openForm)UI.openForm();return}
      var regular=e.target.closest&&e.target.closest('[data-route]')
      if(regular&&tasksActive()){taskMode=false;var UI2=root.NestTasksV31;if(UI2&&UI2.close)UI2.close()}
    },true)
    root.addEventListener('submit',function(e){
      var form=e.target
      if(!form||form.id!=='v31TaskForm')return
      e.preventDefault();e.stopImmediatePropagation()
      if(!form.reportValidity||form.reportValidity())saveTask(form)
    },true)
    root.addEventListener('load',function(){
      var App=root.NestAppV3,UI=root.NestTasksV31
      if(!App||!UI||typeof App.render!=='function'||App.__tasksRenderGuard)return
      var original=App.render.bind(App)
      App.render=function(){var result=original.apply(null,arguments);if(taskMode)queueMicrotask(function(){if(taskMode)UI.open()});return result}
      App.__tasksRenderGuard=true
    },{once:true})
  })(globalThis)
  </script>
  <script src="/tasks-v3.1.js?v=3.1.0-r6"></script>
  <script src="/v202-wallet-guard.js?v=3.1.0-r6"></script>
  <script src="/import-v2.0.2.js?v=3.1.0-r6"></script>
  <script src="/app-v3.js?v=3.1.0-r6"></script>
  <script src="/settings-v3.js?v=3.1.0-r6"></script>
  <script src="/v301-shopping.js?v=3.1.0-r6"></script>
</body>
</html>
