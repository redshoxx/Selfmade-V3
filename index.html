<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#26343c">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Selfmade">
  <meta name="description" content="Einkauf, Vorrat, Rezepte, Wochenplanung, Geld und Notizen in einer professionellen Haushalts-App.">
  <meta name="selfmade-version" content="1.2.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css?v=1.2.0">
  <link rel="stylesheet" href="/iphone12.css?v=1.2.0">
  <link rel="stylesheet" href="/professional.css?v=1.2.0">
  <title>Selfmade</title>
</head>
<body>
  <div id="app" aria-live="polite"><main style="font:16px system-ui;padding:32px;max-width:520px;margin:auto"><h1>Selfmade</h1><p>App wird geladen …</p></main></div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json" hidden>
  <script>
    (() => {
      const showStartError = (detail) => {
        const root = document.getElementById('app')
        if (!root || !root.textContent.includes('App wird geladen')) return
        root.innerHTML = `<main style="font:16px system-ui;padding:32px;max-width:620px;margin:auto"><h1>Selfmade konnte nicht gestartet werden</h1><p>${String(detail || 'Unbekannter Startfehler')}</p><button style="font:inherit;padding:10px 14px" onclick="location.reload()">Erneut versuchen</button></main>`
      }
      window.addEventListener('error', (event) => showStartError(event.message || 'JavaScript konnte nicht geladen werden.'))
      window.addEventListener('unhandledrejection', (event) => showStartError(event.reason?.message || event.reason || 'Unbehandelter Startfehler.'))
      setTimeout(() => showStartError('Die App hat nicht innerhalb von 10 Sekunden reagiert.'), 10000)
    })()
  </script>
  <script src="/app.bundle.js?v=1.2.0" defer></script>
  <script src="/professional-ui.js?v=1.2.0" defer></script>
</body>
</html>
