name: Validate HaushaltKlar V21

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/v21-clean-rebuild]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run V21 tests
        run: npm test
      - name: Build Vercel output
        run: npm run build
