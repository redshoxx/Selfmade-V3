name: Validate HaushaltKlar V20

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/v20-grand-experience]

permissions:
  contents: read

concurrency:
  group: validate-v20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build Vercel output
        run: npm run build
