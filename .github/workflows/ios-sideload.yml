name: NEST iOS IPA - Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-sideload.yml'
      - 'ios-sideload-tests.cjs'
      - 'manual-sync-tests.cjs'
      - 'capacitor.config.json'
      - 'package.json'
      - 'index.html'
      - 'settings-v3.js'
      - 'v3-dialogs.css'
      - 'sw.js'
      - 'native-v44.js'
      - 'api/product-lookup.js'
      - 'api/manual-sync.js'

permissions:
  contents: read

concurrency:
  group: nest-ios-sideload
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: Build unsigned NEST IPA
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: NEST Web-App bauen und testen
        run: npm run build

      - name: iOS-Projekt mit Capacitor und CocoaPods erzeugen
        run: |
          set -euxo pipefail
          rm -rf ios
          pod --version
          npx cap add ios --packagemanager Cocoapods
          npx cap sync ios
          test -f ios/App/Podfile
          test -d ios/App/App.xcworkspace
          ls -la ios/App

      - name: NEST Icon und Splash erzeugen
        run: |
          set -euxo pipefail
          mkdir -p assets
          cp icon.svg assets/logo.svg
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#171715' \
            --iconBackgroundColorDark '#171715' \
            --splashBackgroundColor '#f6f5f2' \
            --splashBackgroundColorDark '#111210'

      - name: iPhone Berechtigungen setzen
        run: |
          set -euxo pipefail
          PLIST='ios/App/App/Info.plist'
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string NEST benötigt die Kamera zum Scannen von Produkt-Barcodes." "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      - name: Unsigned iPhone App kompilieren
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee ios-xcodebuild.log

      - name: Sideloadly IPA erstellen und Bundle-IDs reparieren
        run: |
          set -euxo pipefail
          APP_PATH="$(find ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo 'Keine kompilierte .app gefunden.'
            exit 1
          fi

          rm -rf Payload NEST-v4.4.0-Sideloadly.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/NEST.app

          APP_PLIST='Payload/NEST.app/Info.plist'
          test -f "$APP_PLIST"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PLIST")"
          test "$APP_ID" = 'at.nest.selfmade'
          test -n "$EXECUTABLE"
          test -f "Payload/NEST.app/$EXECUTABLE"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 4.4.0" "$APP_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 4.4.0" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${GITHUB_RUN_NUMBER}" "$APP_PLIST"

          # Die IPA ist an dieser Stelle absichtlich unsigniert. Manche CocoaPods-
          # Frameworks übernehmen beim unsigned Build dieselbe CFBundleIdentifier.
          # Sideloadly/iOS lehnt das als DuplicateIdentifier ab. Deshalb bekommt
          # jedes eingebettete Framework vor dem späteren Sideloadly-Signing eine
          # eigene, gültige und garantiert eindeutige Bundle-ID.
          INDEX=0
          if [ -d Payload/NEST.app/Frameworks ]; then
            while IFS= read -r -d '' PLIST; do
              INDEX=$((INDEX + 1))
              RELATIVE="${PLIST#Payload/NEST.app/}"
              OLD_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" 2>/dev/null || true)"
              NEW_ID="at.nest.selfmade.embedded.f${INDEX}"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_ID" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $NEW_ID" "$PLIST"
              echo "Bundle-ID repariert: $RELATIVE : ${OLD_ID:-<leer>} -> $NEW_ID"
            done < <(find Payload/NEST.app/Frameworks -type f -name Info.plist -print0 | sort -z)
          fi

          # Danach hart verifizieren: App-ID darf nirgendwo eingebettet vorkommen
          # und keine zwei eingebetteten Bundles dürfen dieselbe ID besitzen.
          BAD=0
          IDS_FILE="$(mktemp)"
          if [ -d Payload/NEST.app/Frameworks ]; then
            while IFS= read -r -d '' PLIST; do
              BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" 2>/dev/null || true)"
              RELATIVE="${PLIST#Payload/NEST.app/}"
              echo "Prüfung: $RELATIVE -> ${BUNDLE_ID:-<keine Bundle-ID>}"
              if [ -n "$BUNDLE_ID" ]; then
                echo "$BUNDLE_ID" >> "$IDS_FILE"
              fi
              if [ "$BUNDLE_ID" = "$APP_ID" ]; then
                echo "::error::Embedded bundle $RELATIVE verwendet fälschlich die App-ID $APP_ID"
                BAD=1
              fi
            done < <(find Payload/NEST.app/Frameworks -type f -name Info.plist -print0 | sort -z)
          fi

          DUPLICATES="$(sort "$IDS_FILE" | uniq -d || true)"
          if [ -n "$DUPLICATES" ]; then
            echo "::error::Doppelte Bundle-Identifier in eingebetteten Frameworks gefunden:"
            echo "$DUPLICATES"
            BAD=1
          fi
          rm -f "$IDS_FILE"
          test "$BAD" -eq 0

          file "Payload/NEST.app/$EXECUTABLE"
          /usr/bin/zip -qry NEST-v4.4.0-Sideloadly.ipa Payload
          /usr/bin/unzip -t NEST-v4.4.0-Sideloadly.ipa
          ls -lh NEST-v4.4.0-Sideloadly.ipa

      - name: Diagnose bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NEST-iOS-build-diagnostics
          path: |
            ios-xcodebuild.log
            ios/App/Podfile
            ios/App/Podfile.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: IPA als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: NEST-v4.4.0-Sideloadly
          path: NEST-v4.4.0-Sideloadly.ipa
          if-no-files-found: error
          retention-days: 30
